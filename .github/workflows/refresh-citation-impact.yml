name: Refresh CoSAI Citation Impact Report

on:
  schedule:
    # Every Monday at noon Eastern; GitHub applies daylight saving automatically.
    - cron: "0 12 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      publish_report:
        description: Publish generated data to the report branch (no code changes)
        type: boolean
        default: false

concurrency:
  group: cosai-citation-impact-refresh
  cancel-in-progress: false

jobs:
  refresh-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out selected code ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate report generation and isolated publication
        run: |
          python -m unittest discover -s scripts/tests -p 'test_refresh_citation_impact.py' -v
          python -m unittest discover -s scripts/tests -p 'test_citation_report_branch.py' -v

      - name: Restore previous discovery progress as data only
        id: restore
        run: python scripts/citation_report_branch.py restore --destination "$RUNNER_TEMP/citation-resume"

      - name: Refresh report and discover public references
        id: refresh
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python -u scripts/refresh_citation_impact.py --discover --max-results-per-query 10 --discovery-budget-seconds 180 --resume-from "$RUNNER_TEMP/citation-resume" --fail-on-discovery-error
          status=$?
          set -e
          # Exit 2 is explicit, resumable partial discovery. Other failures must
          # never publish potentially stale or invalid report files.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Preserve refresh output for diagnosis
        # On an early failure these may be checked-in snapshots. Inspect metadata
        # and run health; an uploaded artifact does not establish refresh success.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: citation-impact-refresh
          path: |
            TSC Deliverables/citation-impact/README.md
            TSC Deliverables/citation-impact/discovered-candidates.json
            TSC Deliverables/citation-impact/discovery-state.json
          retention-days: 14

      - name: Automatically publish clearly labeled discovery results
        id: publish
        # A diagnostic artifact outage must not block valid publication. Explicit
        # refresh health still blocks test failures, fatal errors, and timeouts.
        if: ${{ !cancelled() && steps.refresh.outcome == 'success' && steps.refresh.outputs.exit_code != '' && ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_report)) }}
        env:
          EXPECTED_PUBLICATION_HEAD: ${{ steps.restore.outputs.publication_head }}
        run: python scripts/citation_report_branch.py publish --expected-head "$EXPECTED_PUBLICATION_HEAD"

      - name: Summarize discovery and publication health
        if: ${{ always() && steps.refresh.outputs.exit_code != '' }}
        env:
          PUBLISHED_COMMIT: ${{ steps.publish.outputs.commit }}
        run: python scripts/citation_report_branch.py summary --publication "$PUBLISHED_COMMIT"

      - name: Mark incomplete discovery unhealthy after preserving progress
        if: ${{ always() && steps.refresh.outputs.exit_code == '2' }}
        run: |
          echo "::error::Discovery is partial. Generated findings and resume state were preserved; see the summary for publication status."
          exit 1
