name: Refresh CoSAI Citation Impact Report

on:
  schedule:
    # Every Monday at noon Eastern; GitHub applies daylight saving automatically.
    - cron: "0 12 * * 1"
      timezone: "America/New_York"
  workflow_dispatch:

concurrency:
  group: cosai-citation-impact-refresh
  cancel-in-progress: false

jobs:
  refresh-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate report generation
        run: python -m unittest discover -s scripts/tests -p 'test_refresh_citation_impact.py' -v

      - name: Refresh verified report and discover public references
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u scripts/refresh_citation_impact.py --discover --max-results-per-query 10 --fail-on-discovery-error

      - name: Preserve refresh output for diagnosis and review
        # On an early failure these may be the checked-in snapshot; inspect
        # last_refreshed/discovery_warnings and the run status before using them.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: citation-impact-refresh
          path: |
            TSC Deliverables/citation-impact/README.md
            TSC Deliverables/citation-impact/discovered-candidates.json
          retention-days: 14

      - name: Open or update review pull request
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/citation-impact-report
          add-paths: |
            TSC Deliverables/citation-impact/README.md
            TSC Deliverables/citation-impact/discovered-candidates.json
          delete-branch: true
          commit-message: "docs: refresh CoSAI citation impact report"
          title: "docs: refresh CoSAI citation and external impact report"
          body: |
            ## Summary

            Refreshes the CoSAI TSC citation and external-impact report.

            - Updates the public Markdown snapshot and refresh date.
            - Discovers additional public GitHub and Crossref references.
            - Keeps unreviewed discoveries separate from verified citation totals.

            ## Review checklist

            - [ ] Inspect newly discovered candidate references.
            - [ ] Promote only verified sources into `sources.json`.
            - [ ] Confirm member-affiliated sources are classified accurately.
          labels: |
            documentation
            deliverable-publication
